<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            /* 深咖啡工匠配色 */
            --primary-color: #4B3832;           /* 深咖啡 */
            --primary-gradient: linear-gradient(135deg, #3C2F2F 0%, #BE9B7B 100%);
            --bg-color: #FDFBF9;                /* 暖奶油白 */
            --text-main: #2C2523;               /* 焦炭黑 */
            --text-sub: #85746D;                /* 淺褐灰 */
            --card-shadow: 0 12px 30px rgba(75, 56, 50, 0.08);
            --accent-color: #854442;            /* 價格強調色 */
            --border-color: rgba(75, 56, 50, 0.1);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; padding: 0; color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* 讀取動畫 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 249, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #EAE2D6; border-top: 4px solid var(--primary-color);
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 介面佈局 */
        .hero-banner {
            width: 100%; height: 180px; background: var(--primary-gradient);
            border-radius: 0 0 40px 40px; display: flex; align-items: flex-end; padding-bottom: 45px;
        }
        .hero-content { padding-left: 25px; color: #FDFBF9; }
        .status-badge {
            display: inline-block; background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(10px);
            padding: 5px 14px; border-radius: 20px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.1);
        }

        .container { max-width: 500px; margin: -35px auto 0 auto; padding: 0 20px 150px 20px; }
        .header-box {
            background: #fff; padding: 22px; border-radius: 24px; box-shadow: var(--card-shadow);
            margin-bottom: 25px; text-align: center; border: 1px solid var(--border-color);
        }

        /* 菜單卡片 */
        .menu-item { 
            background: #fff; margin-bottom: 18px; padding: 14px; border-radius: 22px;
            display: flex; align-items: center; box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color); transition: transform 0.2s;
        }
        .menu-item:active { transform: scale(0.98); }
        .item-img { width: 85px; height: 85px; border-radius: 16px; object-fit: cover; margin-right: 18px; }
        .item-info { flex: 1; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; }
        .item-price { color: var(--accent-color); font-weight: 700; font-size: 1.15rem; }

        /* 數量控制 */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 8px; background: #F2E9E1; padding: 8px; border-radius: 30px; }
        .btn-circle {
            background: #fff; color: var(--primary-color); border: none; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer; font-size: 1.1rem; font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .quantity { font-weight: 700; color: var(--primary-color); }

        /* 底部結帳欄 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: auto;
            background: rgba(253, 251, 249, 0.9); backdrop-filter: blur(20px);
            padding: 20px 25px 40px 25px; border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 30px rgba(75, 56, 50, 0.05); border-top: 1px solid var(--border-color);
        }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .total-price { color: var(--primary-color); font-size: 1.6rem; font-weight: 700; }

        .submit-btn {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700; color: #fff;
            background: var(--primary-gradient); border: none; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(75, 56, 50, 0.2); cursor: pointer; letter-spacing: 2px;
        }
        .submit-btn:disabled { background: #D9D2CD; box-shadow: none; cursor: not-allowed; opacity: 0.7; }

        /* 成功動畫 */
        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
        }
        .checkmark-circle {
            width: 100px; height: 100px; border-radius: 50%; background: var(--primary-color);
            display: flex; justify-content: center; align-items: center; animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="loading-mask" class="loading-overlay">
        <div class="loader"></div>
        <p style="color: var(--text-sub); margin-top: 15px;">正在準備美味菜單...</p>
    </div>

    <div id="success-overlay">
        <div class="checkmark-circle"><span style="color: #BE9B7B; font-size: 60px;">✓</span></div>
        <h2 style="margin-top: 25px; color: var(--primary-color);">訂單發送成功！</h2>
    </div>

    <div class="hero-banner">
        <div class="hero-content">
            <div class="status-badge">● 咖啡工坊系統</div>
            <h1 style="margin: 12px 0 0 0; font-size: 1.6rem;">午餐團購專案</h1>
        </div>
    </div>

    <div class="container">
        <div class="header-box"><h2 id="display-name">🏪 餐廳載入中...</h2></div>
        <div id="menu-list"></div>
        <div class="bottom-bar">
            <div class="total-row">
                <span style="color: var(--text-sub);">合計金額</span>
                <span id="total-price" class="total-price">$0</span>
            </div>
            <button class="submit-btn" id="submit-button" onclick="sendOrder()" disabled>確認送出訂單</button>
        </div>
    </div>

<script>
    const menuData = [
        { "id": 1, "item": "起司牛肉堡", "price": 120, "note": "多汁牛肉配香濃起司", "img": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" },
        { "id": 2, "item": "脆雞鮮蔬堡", "price": 105, "note": "在地小農契作生菜", "img": "https://images.unsplash.com/photo-1513185158878-8d8c196b3c6c?w=200" },
        { "id": 3, "item": "貢丸湯", "price": 35, "note": "純手工古法製作", "img": "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=200" },
        { "id": 4, "item": "經典大紅茶", "price": 25, "note": "回甘不苦澀", "img": "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=200" }
    ];

    let cart = JSON.parse(localStorage.getItem('groupBuyCart')) || {};

    async function initLIFF() {
        try {
            await liff.init({ liffId: "2006132646-rOQ8yDax" });
            if (!liff.isLoggedIn()) liff.login();
            const profile = await liff.getProfile();
            document.getElementById('display-name').innerText = `☕️ ${profile.displayName} 的專屬選單`;
        } catch (err) {
            document.getElementById('display-name').innerText = "☕️ 今天的午餐菜單";
        } finally {
            setTimeout(() => {
                document.getElementById('loading-mask').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-mask').style.display = 'none', 500);
            }, 800);
        }
    }

    function renderMenu() {
        document.getElementById('menu-list').innerHTML = menuData.map(product => {
            const qty = cart[product.id] || 0;
            return `
                <div class="menu-item">
                    <img src="${product.img}" class="item-img">
                    <div class="item-info">
                        <div class="item-name">${product.item}</div>
                        <div class="item-note" style="font-size:0.85rem; color:var(--text-sub);">${product.note}</div>
                        <div class="item-price">$${product.price}</div>
                    </div>
                    <div class="controls">
                        <button class="btn-circle" onclick="updateQty(${product.id}, 1)">+</button>
                        <span class="quantity">${qty}</span>
                        <button class="btn-circle" onclick="updateQty(${product.id}, -1)" ${qty === 0 ? 'style="visibility:hidden"' : ''}>−</button>
                    </div>
                </div>`;
        }).join('');
        calculateTotal();
    }

    function updateQty(id, change) {
        cart[id] = (cart[id] || 0) + change;
        if (cart[id] <= 0) delete cart[id];
        localStorage.setItem('groupBuyCart', JSON.stringify(cart));
        if (window.navigator.vibrate) window.navigator.vibrate(15);
        renderMenu();
    }

    function calculateTotal() {
        let total = 0;
        menuData.forEach(p => { total += (cart[p.id] || 0) * p.price; });
        document.getElementById('total-price').innerText = `$${total}`;
        document.getElementById('submit-button').disabled = (total === 0);
    }

    function sendOrder() {
        const orderItems = menuData.filter(p => cart[p.id] > 0);
        let summary = orderItems.map(item => `${item.item} x ${cart[item.id]}`).join('\n');
        const total = document.getElementById('total-price').innerText;

        if (!confirm(`📝 確認訂單：\n\n${summary}\n合計：${total}`)) return;

        const msg = `📋 我的點餐：\n${summary}\n總計：${total}`;
        if (liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: msg }])
                .then(() => {
                    localStorage.removeItem('groupBuyCart');
                    document.getElementById('success-overlay').style.display = 'flex';
                    setTimeout(() => liff.closeWindow(), 2000);
                }).catch(() => alert('發送失敗'));
        } else {
            localStorage.removeItem('groupBuyCart');
            document.getElementById('success-overlay').style.display = 'flex';
            setTimeout(() => location.reload(), 2000);
        }
    }

    initLIFF();
    renderMenu();
</script>
</body>
</html>
