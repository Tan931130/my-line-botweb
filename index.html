<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    
    <!-- 引入專業中文字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        /* --- 視覺定義 (CSS) --- */
        :root {
            --primary-color: #FF7E5F;
            --primary-gradient: linear-gradient(135deg, #FF7E5F 0%, #FEB47B 100%);
            --bg-color: #FFF9F5;
            --text-main: #4A4A4A;
            --text-sub: #A0A0A0;
            --card-shadow: 0 8px 20px rgba(255, 126, 95, 0.1);
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; padding: 0; color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* 讀取動畫 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color);
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 頂部橫幅 */
        .hero-banner {
            width: 100%; height: 160px;
            background: var(--primary-gradient);
            border-radius: 0 0 30px 30px;
            position: relative; overflow: hidden;
        }
        .hero-content {
            position: absolute; bottom: 40px; left: 25px; color: white;
        }
        .status-badge {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .container { 
            max-width: 500px; margin: -30px auto 0 auto; 
            padding: 0 15px 140px 15px; position: relative;
        }

        .header-box {
            background: white; padding: 20px; border-radius: 20px;
            box-shadow: var(--card-shadow); margin-bottom: 20px; text-align: center;
        }
        .header-box h2 { margin: 0; font-size: 1.2rem; color: #333; }

        /* 菜單卡片 */
        .menu-item { 
            background: white; margin-bottom: 15px; padding: 16px; 
            border-radius: 18px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.02);
            transition: transform 0.2s ease;
        }
        .menu-item:active { transform: scale(0.98); }
        
        .item-info { flex: 1; cursor: pointer; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
        .item-note { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
        .item-price { color: #e44d26; font-weight: 700; font-size: 1.1rem; }

        /* 控制按鈕 */
        .controls { display: flex; align-items: center; gap: 15px; background: #f8f9fa; padding: 5px 12px; border-radius: 30px; }
        .btn-circle {
            background: white; color: var(--primary-color); border: 1px solid #eee;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: 0.2s;
        }
        .btn-circle:active { background: #eee; }
        .btn-circle:disabled { color: #ccc; box-shadow: none; }
        .quantity { font-weight: 700; min-width: 20px; text-align: center; }

        /* 底部固定欄 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            padding: 15px 25px 35px 25px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            max-width: 500px; margin: auto; z-index: 1000;
            border-radius: 25px 25px 0 0;
        }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .total-label { color: var(--text-sub); font-size: 0.9rem; }
        .total-price { color: var(--primary-color); font-size: 1.5rem; font-weight: 700; }

        .submit-btn {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700;
            color: white; background: var(--primary-gradient); 
            border: none; border-radius: 50px;
            box-shadow: 0 8px 20px rgba(255, 126, 95, 0.3);
            cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { transform: translateY(-2px); }

        /* 詳情彈窗 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; width: 80%; max-width: 350px; padding: 25px;
            border-radius: 25px; text-align: center; position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #ccc; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loading-mask" class="loading-overlay">
        <div class="loader"></div>
        <p style="color: #888; font-size: 0.9rem;">AI 正在準備菜單...</p>
    </div>

    <div class="hero-banner">
        <div class="hero-content">
            <div class="status-badge">● 連線正常</div>
            <h1 style="margin: 10px 0 0 0; font-size: 1.5rem;">午餐團購專案</h1>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <h2 id="display-name">🏪 餐廳載入中...</h2>
        </div>
        <div id="menu-list"></div>

        <div class="bottom-bar">
            <div class="total-row">
                <span class="total-label">合計金額</span>
                <span id="total-price" class="total-price">$0</span>
            </div>
            <button class="submit-btn" onclick="sendOrder()">確認送出訂單</button>
        </div>
    </div>

    <!-- 詳情彈窗 HTML -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3 id="modal-title" style="color: var(--primary-color);"></h3>
            <p id="modal-desc" style="color: #666; line-height: 1.6;"></p>
            <button class="submit-btn" onclick="closeModal()">我瞭解了</button>
        </div>
    </div>

<script>
    /* --- 核心邏輯 --- */
    const menuData = [
        { "id": 1, "item": "起司牛肉堡", "price": 120, "note": "多汁牛肉配香濃起司", "desc": "嚴選紐西蘭草飼牛，手工拍打肉排，搭配兩片熔岩切達起司。" },
        { "id": 2, "item": "脆雞鮮蔬堡", "price": 105, "note": "在地小農契作生菜", "desc": "酥脆金黃雞腿排，搭配每日配送新鮮生菜，清爽不油膩。" },
        { "id": 3, "item": "貢丸湯", "price": 35, "note": "純手工古法製作", "desc": "新竹傳承三代技藝，Q彈帶勁，大骨熬製清甜湯頭。" },
        { "id": 4, "item": "經典大紅茶", "price": 25, "note": "回甘不苦澀", "desc": "阿薩姆紅茶為基底，微糖配方，最完美的餐後解膩首選。" }
    ];

    let cart = {};

    async function initLIFF() {
        try {
            // 請記得將下方替換成你的真實 LIFF ID
            await liff.init({ liffId: "你的_LIFF_ID_HERE" }); 
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('display-name').innerText = `🍟 ${profile.displayName} 的專屬選單`;
            }
        } catch (err) {
            document.getElementById('display-name').innerText = "🍟 今天的午餐菜單";
        } finally {
            setTimeout(() => {
                const mask = document.getElementById('loading-mask');
                mask.style.opacity = '0';
                setTimeout(() => mask.style.display = 'none', 500);
            }, 1000);
        }
    }

    function renderMenu() {
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = menuData.map(product => {
            const qty = cart[product.id] || 0;
            return `
                <div class="menu-item">
                    <div class="item-info" onclick="showDetail(${product.id})">
                        <div class="item-name">${product.item} ⓘ</div>
                        <div class="item-note">${product.note}</div>
                        <div class="item-price">$${product.price}</div>
                    </div>
                    <div class="controls">
                        <button class="btn-circle" onclick="updateQty(${product.id}, -1)" ${qty === 0 ? 'disabled' : ''}>−</button>
                        <span class="quantity">${qty}</span>
                        <button class="btn-circle" onclick="updateQty(${product.id}, 1)">+</button>
                    </div>
                </div>
            `;
        }).join('');
        calculateTotal();
    }

    function showDetail(id) {
        const item = menuData.find(p => p.id === id);
        document.getElementById('modal-title').innerText = item.item;
        document.getElementById('modal-desc').innerText = item.desc;
        document.getElementById('item-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('item-modal').style.display = 'none';
    }

    function updateQty(id, change) {
        const currentQty = cart[id] || 0;
        if (currentQty + change >= 0) {
            cart[id] = currentQty + change;
            // 觸發手機震動回饋
            if (window.navigator.vibrate) window.navigator.vibrate(20);
        }
        renderMenu();
    }

    function calculateTotal() {
        let total = 0;
        menuData.forEach(p => { total += (cart[p.id] || 0) * p.price; });
        document.getElementById('total-price').innerText = `$${total}`;
    }

    function sendOrder() {
        const orderItems = menuData.filter(p => cart[p.id] > 0);
        if (orderItems.length === 0) {
            alert("先選點好吃的東西吧！");
            return;
        }

        let orderText = "📋 我的點餐紀錄：\n";
        orderItems.forEach(item => {
            orderText += `- ${item.item} x ${cart[item.id]}\n`;
        });
        orderText += `\n總計：${document.getElementById('total-price').innerText}`;

        if (liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: orderText }])
                .then(() => liff.closeWindow())
                .catch(err => alert('發送失敗，請確認權限設定。'));
        } else {
            alert("訂單已模擬送出：\n" + orderText);
        }
    }

    initLIFF();
    renderMenu();
</script>
</body>
</html>
