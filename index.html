<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            /* 莫蘭迪質感配色 */
            --primary-color: #5F7161;           /* 深森林綠 (主色) */
            --primary-gradient: linear-gradient(135deg, #6D8299 0%, #92BA92 100%); /* 灰藍綠漸層 */
            --bg-color: #F9F7F2;                /* 暖奶油白 (背景) */
            --text-main: #3E3E3E;               /* 深石墨灰 (文字) */
            --text-sub: #8D8D8D;                /* 灰褐色 (副標) */
            --card-shadow: 0 10px 30px rgba(95, 113, 97, 0.08); /* 極淡綠影 */
            --accent-color: #D4A373;            /* 大地色 (強調/價格) */
            --white: #ffffff;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; padding: 0; color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* 讀取動畫 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color);
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 頂部橫幅 */
        .hero-banner {
            width: 100%; height: 180px;
            background: var(--primary-gradient);
            border-radius: 0 0 40px 40px;
            position: relative; overflow: hidden;
            display: flex; align-items: flex-end; padding-bottom: 45px;
        }
        .hero-content { padding-left: 25px; color: white; }
        .status-badge {
            display: inline-block; background: rgba(59, 3, 3, 0.363);
            backdrop-filter: blur(10px); padding: 5px 14px; border-radius: 20px;
            font-size: 0.75rem; border: 1px solid rgba(59, 3, 3, 0.363); letter-spacing: 1px;
        }

        .container { 
            max-width: 500px; margin: -35px auto 0 auto; 
            padding: 0 20px 150px 20px; position: relative;
        }

        .header-box {
            background: var(--white); padding: 22px; border-radius: 24px;
            box-shadow: var(--card-shadow); margin-bottom: 25px; text-align: center;
        }
        .header-box h2 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px; }

        /* 菜單卡片 */
        .menu-item { 
            background: var(--white); margin-bottom: 18px; padding: 14px; 
            border-radius: 22px; display: flex; 
            align-items: center; box-shadow: var(--card-shadow);
            border: 1px solid rgba(59, 3, 3, 0.363);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .menu-item:active { transform: scale(0.97); }
        
        .item-img {
            width: 85px; height: 85px; border-radius: 16px;
            object-fit: cover; margin-right: 18px;
        }

        .item-info { flex: 1; cursor: pointer; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; color: var(--text-main); }
        .item-note { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
        .item-price { color: var(--accent-color); font-weight: 700; font-size: 1.15rem; }

        /* 控制按鈕 */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; background: #f4f5f1; padding: 10px; border-radius: 35px; min-width: 32px;}
        .btn-circle {
            background: var(--white); color: var(--primary-color); border: none;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 8px rgba(59, 3, 3, 0.363);
        }
        .quantity { font-weight: 700; font-size: 0.95rem; color: var(--primary-color); }

        /* 底部固定欄 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(59, 3, 3, 0.363);
            backdrop-filter: blur(20px);
            padding: 20px 25px 40px 25px;
            box-shadow: 0 -10px 30px rgba(59, 3, 3, 0.363);
            max-width: 500px; margin: auto; z-index: 1000;
            border-radius: 30px 30px 0 0;
        }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .total-price { color: var(--primary-color); font-size: 1.6rem; font-weight: 700; }

        .submit-btn {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700;
            color: white; background: var(--primary-gradient); 
            border: none; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(109, 130, 153, 0.3);
            cursor: pointer; transition: all 0.4s ease;
            letter-spacing: 2px;
        }

        .submit-btn:disabled {
            background: #d1d1d1; box-shadow: none; cursor: not-allowed; opacity: 0.7;
        }

        /* 成功動畫遮罩 */
        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
        }
        .checkmark-circle {
            width: 100px; height: 100px; border-radius: 50%; background: #92BA92;
            display: flex; justify-content: center; align-items: center;
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(146, 186, 146, 0.3);
        }
        .checkmark { color: white; font-size: 60px; }
        @keyframes scaleUp { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="loading-mask" class="loading-overlay">
        <div class="loader"></div>
        <p style="color: var(--text-sub); font-size: 0.9rem; letter-spacing: 1px;">正在準備美味菜單...</p>
    </div>

    <div id="success-overlay">
        <div class="checkmark-circle"><span class="checkmark">✓</span></div>
        <h2 style="margin-top: 25px; color: var(--primary-color); letter-spacing: 1px;">訂單發送成功！</h2>
        <p style="color: var(--text-sub);">正在為您關閉視窗...</p>
    </div>

    <div class="hero-banner">
        <div class="hero-content">
            <div class="status-badge">● 點餐系統連線中</div>
            <h1 style="margin: 12px 0 0 0; font-size: 1.6rem; letter-spacing: 1px;">午餐團購專案</h1>
        </div>
    </div>

    <div class="container">
        <div class="header-box">
            <h2 id="display-name">🏪 餐廳載入中...</h2>
        </div>
        <div id="menu-list"></div>

        <div class="bottom-bar">
            <div class="total-row">
                <span style="color: var(--text-sub); font-weight: 500;">合計金額</span>
                <span id="total-price" class="total-price">$0</span>
            </div>
            <button class="submit-btn" id="submit-button" onclick="sendOrder()">確認送出訂單</button>
        </div>
    </div>

<script>
    const menuData = [
        { "id": 1, "item": "起司牛肉堡", "price": 120, "note": "多汁牛肉配香濃起司", "img": "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200", "desc": "嚴選紐西蘭草飼牛，手工拍打肉排，搭配兩片熔岩切達起司。" },
        { "id": 2, "item": "脆雞鮮蔬堡", "price": 105, "note": "在地小農契作生菜", "img": "https://images.unsplash.com/photo-1513185158878-8d8c196b3c6c?w=200", "desc": "酥脆金黃雞腿排，搭配每日配送新鮮生菜，清爽不油膩。" },
        { "id": 3, "item": "貢丸湯", "price": 35, "note": "純手工古法製作", "img": "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=200", "desc": "新竹傳承三代技藝，Q彈帶勁，大骨熬製清甜湯頭。" },
        { "id": 4, "item": "經典大紅茶", "price": 25, "note": "回甘不苦澀", "img": "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=200", "desc": "阿薩姆紅茶為基底，微糖配方，最完美的餐後解膩首選。" }
    ];

    // 初始化：正確讀取 LocalStorage
    let cart = JSON.parse(localStorage.getItem('groupBuyCart')) || {};

    async function initLIFF() {
        try {
            await liff.init({ liffId: "2006132646-rOQ8yDax" }); // 這裡已換回你的 ID
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById('display-name').innerText = `🌿 ${profile.displayName} 的專屬選單`;
            }
        } catch (err) {
            document.getElementById('display-name').innerText = "🌿 今天的午餐菜單";
        } finally {
            setTimeout(() => {
                const mask = document.getElementById('loading-mask');
                mask.style.opacity = '0';
                setTimeout(() => mask.style.display = 'none', 500);
            }, 800);
        }
    }

    function renderMenu() {
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = menuData.map(product => {
            const qty = cart[product.id] || 0;
            return `
                <div class="menu-item">
                    <img src="${product.img}" class="item-img">
                    <div class="item-info">
                        <div class="item-name">${product.item}</div>
                        <div class="item-note">${product.note}</div>
                        <div class="item-price">$${product.price}</div>
                    </div>
                    <div class="controls">
                        <button class="btn-circle" onclick="updateQty(${product.id}, 1)">+</button>
                        <span class="quantity">${qty}</span>
                        <button class="btn-circle" onclick="updateQty(${product.id}, -1)" ${qty === 0 ? 'style="visibility:hidden"' : ''}>−</button>
                    </div>
                </div>
            `;
        }).join('');
        calculateTotal();
    }

    function updateQty(id, change) {
        const currentQty = cart[id] || 0;
        if (currentQty + change >= 0) {
            cart[id] = currentQty + change;
            localStorage.setItem('groupBuyCart', JSON.stringify(cart));
            if (window.navigator.vibrate) window.navigator.vibrate(15);
        }
        renderMenu();
    }

    function calculateTotal() {
        let total = 0;
        menuData.forEach(p => { total += (cart[p.id] || 0) * p.price; });
        document.getElementById('total-price').innerText = `$${total}`;
        document.getElementById('submit-button').disabled = (total === 0);
    }

    function sendOrder() {
        const orderItems = menuData.filter(p => cart[p.id] > 0);
        let summaryText = "";
        orderItems.forEach(item => { summaryText += `${item.item} x ${cart[item.id]}\n`; });
        const totalText = document.getElementById('total-price').innerText;

        const isConfirmed = confirm(`📝 請確認訂單內容：\n\n${summaryText}\n合計：${totalText}\n\n確定要送出嗎？`);
        if (!isConfirmed) return;

        let orderLineText = "📋 我的點餐紀錄：\n" + summaryText + "\n總計：" + totalText;

        const showSuccess = () => {
            localStorage.removeItem('groupBuyCart');
            document.getElementById('success-overlay').style.display = 'flex';
            setTimeout(() => {
                if (liff.isInClient()) liff.closeWindow();
                else location.reload();
            }, 2000);
        };

        if (liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: orderLineText }])
                .then(() => showSuccess())
                .catch(err => alert('發送失敗，請稍後再試'));
        } else {
            showSuccess();
        }
    }

    initLIFF();
    renderMenu();
</script>
</body>
</html>
