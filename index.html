<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --dark-espresso: #2D1B14;
            --coffee-bean: #4E342E;
            --parchment: #FDFBF9;
            --price-accent: #8D4B39;
            --primary-gradient: linear-gradient(135deg, #8D4B39 0%, #2D1B14 100%);
        }

        /* 鎖定背景防止彈跳 */
        html, body { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--parchment); overflow: hidden;
            font-family: 'Noto Sans TC', sans-serif;
        }

        .main-container {
            display: flex; flex-direction: column; height: 100vh;
            max-width: 500px; margin: 0 auto;
        }

        /* 頂部橫幅 */
        .header-banner {
            flex: 0 0 100px; background: linear-gradient(135deg, #1A100C 0%, #3D261E 100%);
            border-radius: 0 0 25px 25px; display: flex; align-items: flex-end;
            padding: 0 20px 15px; position: relative;
        }

        .history-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 5px 12px; border-radius: 20px; font-size: 0.8rem;
        }

        /* 關鍵：強制中間捲動區塊 */
        .menu-scroller { 
            flex: 1; overflow-y: scroll !important; 
            -webkit-overflow-scrolling: touch; padding: 15px;
        }

        .item-card { 
            background: white; margin-bottom: 12px; padding: 15px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 底部操作區 */
        .checkout-bar {
            flex: 0 0 auto; background: white; padding: 15px 20px 30px;
            border-top: 1px solid #EEE; box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        /* 恆定咖啡色按鈕 */
        .btn-confirm {
            width: 100%; padding: 16px; border-radius: 50px; border: none;
            font-size: 1.1rem; font-weight: 700; color: white !important;
            background: var(--primary-gradient) !important; /* 強制背景色 */
            box-shadow: 0 6px 15px rgba(141, 75, 57, 0.3);
            cursor: pointer;
        }

        /* 即使不可點擊，也不要變色 */
        .btn-confirm:disabled {
            opacity: 0.6; /* 僅稍微降低透明度，背景色依舊是咖啡色 */
            cursor: not-allowed;
        }

        .circle-control {
            background: var(--dark-espresso); color: white; border: none; 
            width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-banner">
            <button class="history-btn" onclick="openHistory()">📜 歷史紀錄</button>
            <h1 style="color:white; margin:0; font-size:1.3rem;">午餐團購小助手</h1>
        </div>

        <!-- 確保這裡可以滾動 -->
        <div class="menu-scroller">
            <div id="menu-list"></div>
            <div style="height: 30px;"></div>
        </div>

        <div class="checkout-bar">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <span style="font-weight:500;">結帳總額</span>
                <span id="total-price" style="font-size:1.7rem; font-weight:800;">$0</span>
            </div>
            <!-- 按鈕永遠維持漸層咖啡色 -->
            <button class="btn-confirm" id="submit-button" onclick="sendOrder()" disabled>確認點餐</button>
        </div>
    </div>

    <!-- 歷史紀錄 -->
    <div id="history-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
        <div style="background:white; width:85%; padding:20px; border-radius:15px;">
            <h3>📜 歷史紀錄</h3>
            <div id="history-content" style="max-height:250px; overflow-y:auto;"></div>
            <button onclick="closeHistory()" style="width:100%; margin-top:15px; padding:10px; background:var(--dark-espresso); color:white; border:none; border-radius:10px;">關閉</button>
        </div>
    </div>

<script>
    const products = [
        { id: 1, name: "起司牛肉堡", price: 120, info: "多汁牛肉配香濃起司" },
        { id: 2, name: "脆雞鮮蔬堡", price: 105, info: "在地小農契作生菜" },
        { id: 3, name: "貢丸湯", price: 35, info: "純手工古法製作" },
        { id: 4, name: "經典大紅茶", price: 25, info: "回甘不苦澀" },
        { id: 5, name: "黃金薯條", price: 45, info: "酥脆推薦" },
        { id: 6, name: "雞塊(6塊)", price: 60, info: "人氣單品" }
    ];

    let myCart = {};

    function updateView() {
        const list = document.getElementById('menu-list');
        list.innerHTML = products.map(p => {
            const count = myCart[p.id] || 0;
            return `
                <div class="item-card">
                    <div>
                        <div style="font-weight:700;">${p.name}</div>
                        <div style="font-size:0.75rem; color:#888;">${p.info}</div>
                        <div style="color:var(--price-accent); font-weight:700; margin-top:5px;">$${p.price}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px; background:#F2E9E4; padding:6px 12px; border-radius:20px;">
                        <button class="circle-control" onclick="changeQty(${p.id},-1)" ${count===0?'style="visibility:hidden"':''}>−</button>
                        <span style="font-weight:700;">${count}</span>
                        <button class="circle-control" onclick="changeQty(${p.id},1)">+</button>
                    </div>
                </div>`;
        }).join('');
        
        let total = 0;
        Object.keys(myCart).forEach(id => {
            const p = products.find(x => x.id == id);
            total += p.price * myCart[id];
        });
        
        document.getElementById('total-price').innerText = `$${total}`;
        document.getElementById('submit-button').disabled = (total === 0);
    }

    function changeQty(id, num) {
        myCart[id] = (myCart[id] || 0) + num;
        if (myCart[id] <= 0) delete myCart[id];
        updateView();
    }

    function sendOrder() {
        const summary = Object.keys(myCart).map(id => {
            const p = products.find(x => x.id == id);
            return `${p.name} x ${myCart[id]}`;
        }).join('\n');
        
        if (liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: "📋 我的點餐內容：\n" + summary }]).then(() => liff.closeWindow());
        } else {
            alert("點餐內容：\n" + summary);
        }
    }

    function openHistory() { document.getElementById('history-modal').style.display = 'flex'; }
    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }

    liff.init({ liffId: "2006132646-rOQ8yDax" }).then(() => updateView());
</script>
</body>
</html>
