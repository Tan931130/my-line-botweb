<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            --dark-espresso: #2D1B14;
            --coffee-bean: #4E342E;
            --parchment: #FDFBF9;
            --price-accent: #8D4B39;
            --primary-gradient: linear-gradient(135deg, #8D4B39 0%, #2D1B14 100%);
        }

        /* 關鍵修正：讓 body 不要捲動，讓內部的 container 捲動 */
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--parchment); 
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止整個頁面亂跑 */
        }

        .hero-banner {
            flex: 0 0 120px;
            background: linear-gradient(135deg, #1A100C 0%, #3D261E 100%);
            border-radius: 0 0 25px 25px;
            display: flex; align-items: flex-end; padding: 0 25px 20px;
            position: relative;
        }

        /* 歷史按鈕：固定在右上角 */
        .history-float-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem;
            z-index: 100; cursor: pointer;
        }

        /* 關鍵修正：菜單容器獨立捲動 */
        .container { 
            flex: 1; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* 讓 iOS 捲動更順暢 */
            padding: 20px 15px 30px;
            max-width: 500px; margin: 0 auto;
            width: 100%; box-sizing: border-box;
        }

        .menu-item { 
            background: #FFF; margin-bottom: 12px; padding: 18px; border-radius: 15px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 12px rgba(45, 27, 20, 0.08);
        }

        /* 底部欄位：不擋住捲動區域 */
        .bottom-bar {
            flex: 0 0 auto;
            background: white;
            padding: 15px 25px 30px;
            border-radius: 25px 25px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            max-width: 500px; margin: 0 auto; width: 100%; box-sizing: border-box;
        }

        /* 強制按鈕漸層色 */
        .submit-btn {
            width: 100%; padding: 15px; border-radius: 50px; border: none;
            font-size: 1.1rem; font-weight: 700; color: white !important;
            background: var(--primary-gradient) !important;
            box-shadow: 0 6px 15px rgba(141, 75, 57, 0.3);
            cursor: pointer; transition: 0.3s;
        }

        .submit-btn:disabled {
            background: #D1C7C2 !important;
            box-shadow: none; opacity: 0.8; cursor: not-allowed;
        }

        .btn-circle {
            background: var(--dark-espresso); color: #FFF; border: none; 
            width: 28px; height: 28px; border-radius: 50%; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center;
        }

        /* 彈窗樣式 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; width: 85%; max-width: 400px; border-radius: 20px; padding: 25px; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <button class="history-float-btn" onclick="showOrderHistory()">📜 歷史紀錄</button>
        <h1 style="color:white; margin:0; font-size:1.5rem;">午餐團購</h1>
    </div>

    <!-- 這裡現在可以獨立捲動了 -->
    <div class="container" id="menu-container">
        <div id="menu-list"></div>
    </div>

    <div class="bottom-bar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span style="font-weight:500;">結帳總額</span>
            <span id="total-price" style="font-size:1.8rem; font-weight:800;">$0</span>
        </div>
        <button class="submit-btn" id="submit-button" onclick="sendOrder()" disabled>確認點餐</button>
    </div>

    <div id="history-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">📜 最近點餐</h3>
            <div id="history-list" style="max-height:300px; overflow-y:auto;"></div>
            <button onclick="closeHistory()" style="width:100%; padding:12px; margin-top:15px; background:var(--dark-espresso); color:white; border:none; border-radius:10px;">關閉</button>
        </div>
    </div>

<script>
    const menuData = [
        { "id": 1, "item": "起司牛肉堡", "price": 120, "note": "多汁牛肉配香濃起司" },
        { "id": 2, "item": "脆雞鮮蔬堡", "price": 105, "note": "在地小農契作生菜" },
        { "id": 3, "item": "貢丸湯", "price": 35, "note": "純手工古法製作" },
        { "id": 4, "item": "經典大紅茶", "price": 25, "note": "回甘不苦澀" },
        { "id": 5, "item": "特製薯條", "price": 45, "note": "金黃酥脆" },
        { "id": 6, "item": "玉米濃湯", "price": 40, "note": "香濃可口" }
    ];

    let cart = JSON.parse(localStorage.getItem('groupBuyCart')) || {};

    function renderMenu() {
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = menuData.map(p => {
            const qty = cart[p.id] || 0;
            return `
                <div class="menu-item">
                    <div style="flex:1;">
                        <div style="font-weight:700;">${p.item}</div>
                        <div style="font-size:0.8rem; color:#888;">${p.note}</div>
                        <div style="color:var(--price-accent); font-weight:700; margin-top:5px;">$${p.price}</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; background:#F2E9E4; padding:5px 10px; border-radius:20px;">
                        <button class="btn-circle" onclick="updateQty(${p.id}, -1)" ${qty === 0 ? 'style="visibility:hidden"' : ''}>−</button>
                        <span style="font-weight:700; width:20px; text-align:center;">${qty}</span>
                        <button class="btn-circle" onclick="updateQty(${p.id}, 1)">+</button>
                    </div>
                </div>`;
        }).join('');
        calculateTotal();
    }

    function updateQty(id, change) {
        cart[id] = (cart[id] || 0) + change;
        if (cart[id] <= 0) delete cart[id];
        localStorage.setItem('groupBuyCart', JSON.stringify(cart));
        renderMenu();
    }

    function calculateTotal() {
        let total = 0;
        menuData.forEach(p => total += (cart[p.id] || 0) * p.price);
        document.getElementById('total-price').innerText = `$${total}`;
        document.getElementById('submit-button').disabled = (total === 0);
    }

    function showOrderHistory() {
        const history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
        const container = document.getElementById('history-list');
        container.innerHTML = history.length ? history.map(h => `
            <div style="border-bottom:1px solid #EEE; padding:10px 0;">
                <div style="font-size:0.7rem; color:#888;">${new Date(h.date).toLocaleDateString()}</div>
                <div style="font-weight:700;">${h.details}</div>
                <div style="color:var(--price-accent); font-weight:700;">$${h.total}</div>
            </div>`).join('') : '暫無紀錄';
        document.getElementById('history-modal').style.display = 'flex';
    }

    function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }

    function sendOrder() {
        const items = menuData.filter(p => cart[p.id] > 0);
        const details = items.map(i => `${i.item}x${cart[i.id]}`).join(', ');
        const total = document.getElementById('total-price').innerText;

        const history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
        history.unshift({ date: new Date().toISOString(), details, total: total.replace('$', '') });
        localStorage.setItem('orderHistory', JSON.stringify(history.slice(0, 5)));

        if (liff.isInClient()) {
            liff.sendMessages([{ type: 'text', text: `📋 訂購確認：\n${details}\n總計：${total}` }]).then(() => {
                localStorage.removeItem('groupBuyCart');
                liff.closeWindow();
            });
        } else {
            alert(`已模擬送出：${details}`);
            location.reload();
        }
    }

    liff.init({ liffId: "2006132646-rOQ8yDax" }).then(() => {
        renderMenu();
    });
</script>
</body>
</html>
