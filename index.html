<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 團購點餐小助手</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root {
            /* 深咖啡工匠配色 */
            --primary-color: #4B3832;
            --primary-gradient: linear-gradient(135deg, #3C2F2F 0%, #BE9B7B 100%);
            --bg-color: #FFFBF5;
            --text-main: #2C2523;
            --text-sub: #85746D;
            --card-shadow: 0 12px 35px rgba(75, 56, 50, 0.08);
            --accent-color: #854442;
            --white: #ffffff;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; padding: 0; color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* 讀取動畫 */
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 251, 245, 0.98);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease;
        }
        .loader {
            border: 4px solid #EAE2D6; border-top: 4px solid var(--primary-color);
            border-radius: 50%; width: 45px; height: 45px;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 頂部橫幅 */
        .hero-banner {
            width: 100%; height: 180px;
            background: var(--primary-gradient);
            border-radius: 0 0 40px 40px;
            position: relative; overflow: hidden;
            display: flex; align-items: flex-end; padding-bottom: 45px;
        }
        .hero-content { padding-left: 25px; color: #EAE2D6; }
        .status-badge {
            display: inline-block; background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px); padding: 5px 14px; border-radius: 20px;
            font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.15); letter-spacing: 1px;
        }

        .container { 
            max-width: 500px; margin: -35px auto 0 auto; 
            padding: 0 20px 150px 20px; position: relative;
        }

        .header-box {
            background: var(--white); padding: 22px; border-radius: 24px;
            box-shadow: var(--card-shadow); margin-bottom: 25px; text-align: center;
            border: 1px solid #F2E9E1;
        }
        .header-box h2 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--primary-color); }

        /* 菜單卡片 */
        .menu-item { 
            background: var(--white); margin-bottom: 18px; padding: 14px; 
            border-radius: 22px; display: flex; 
            align-items: center; box-shadow: var(--card-shadow);
            border: 1px solid rgba(75, 56, 50, 0.03);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .menu-item:active { transform: scale(0.97); }
        
        .item-img {
            width: 85px; height: 85px; border-radius: 16px;
            object-fit: cover; margin-right: 18px;
        }

        .item-info { flex: 1; }
        .item-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; color: var(--text-main); }
        .item-note { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 8px; }
        .item-price { color: var(--accent-color); font-weight: 700; font-size: 1.15rem; }

        /* 控制按鈕 */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; background: #F2E9E1; padding: 10px; border-radius: 35px; min-width: 32px;}
        .btn-circle {
            background: var(--white); color: var(--primary-color); border: none;
            width: 30px; height: 30px; border-radius: 50%;
            cursor: pointer; font-size: 1.1rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .quantity { font-weight: 700; font-size: 0.95rem; color: var(--primary-color); }

        /* 底部固定欄 */
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 251, 245, 0.9);
            backdrop-filter: blur(20px);
            padding: 20px 25px 40px 25px;
            box-shadow: 0 -10px 30px rgba(75, 56, 50, 0.05);
            max-width: 500px; margin: auto; z-index: 1000;
            border-radius: 30px 30px 0 0;
            border-top: 1px solid #F2E9E1;
        }
        .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .total-price { color: var(--primary-color); font-size: 1.6rem; font-weight: 700; }

        .submit-btn {
            width: 100%; padding: 16px; font-size: 1.1rem; font-weight: 700;
            color: #FFFBF5; background: var(--primary-gradient); 
            border: none; border-radius: 50px;
            box-shadow: 0 10px 25px rgba(75, 56, 50, 0.2);
            cursor: pointer; transition: all 0.4s ease;
            letter-spacing: 2px;
        }

        .submit-btn:disabled {
            background: #D9D2CD; box-shadow: none; cursor: not-allowed; opacity: 0.7; color: #FFF;
        }

        /* 成功動畫遮罩 */
        #success-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); z-index: 3000; flex-direction: column; justify-content: center; align-items: center;
        }
        .checkmark-circle {
            width: 100px; height: 100px; border-radius: 50%; background: var(--primary-color);
            display: flex; justify-content: center; align-items: center;
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(75, 56, 50, 0.2);
        }
        .checkmark { color: #BE9B7B; font-size: 60px; }
    </style>
</head>
<body>
    <!-- ... 中間的 HTML 結構與 JavaScript 維持不變 ... -->
</body>
</html>
